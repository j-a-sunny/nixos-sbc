name: Build Tanix TX6

# Manual only. Builds natively on GitHub's free arm64 runners (public repos),
# so there is no cross-compiling or QEMU involved.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to build'
        required: true
        default: 'image'
        type: choice
        options:
          - uboot
          - kernel
          - system-kernel
          - image
      nixpkgs_url:
        description: 'system-kernel only: your running system''s nixpkgs URL (from its flake.lock)'
        required: false
        default: ''
        type: string

permissions:
  contents: write # needed to create releases

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The runner disk is small; kernel build + Nix store needs the space.
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/share/boost /usr/local/lib/android /opt/ghc || true
          df -h /

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Cachix (optional)
        if: ${{ vars.CACHIX_REPO != '' }}
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_REPO }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build U-Boot
        if: ${{ inputs.target == 'uboot' || inputs.target == 'image' }}
        run: nix build -L .#packages.aarch64-linux.ubootTanixTx6 -o result-uboot

      - name: Build kernel
        if: ${{ inputs.target == 'kernel' || inputs.target == 'image' }}
        run: nix build -L --keep-going .#nixosConfigurations.tanix-tx6.config.boot.kernelPackages.kernel -o result-kernel

      # Builds the kernel against the nixpkgs of an existing system (e.g. the TX6's own
      # flake) so the result is the exact same derivation that system evaluates and it
      # can be downloaded from the cache instead of compiled on the board.
      - name: Build kernel for an existing system
        if: ${{ inputs.target == 'system-kernel' }}
        run: |
          test -n "${{ inputs.nixpkgs_url }}" || { echo "nixpkgs_url is required for system-kernel"; exit 1; }
          nix build -L --keep-going \
            --override-input nixpkgs "${{ inputs.nixpkgs_url }}" \
            '.#packages.aarch64-linux.linuxPackages_latest_tanixTx6.kernel^*' -o result-system-kernel

      - name: Build SD image
        if: ${{ inputs.target == 'image' }}
        run: nix build -L .#nixosConfigurations.tanix-tx6.config.system.build.sdImage -o result-image

      - name: Collect output
        run: |
          mkdir -p out
          [ -e result-uboot ] && cp -L result-uboot/u-boot-sunxi-with-spl.bin out/ || true
          [ -e result-image ] && cp -L result-image/sd-image/*.zst out/ || true
          ls -lh out

      # Every image build is published as a GitHub release with the image,
      # the standalone U-Boot, and checksums.
      - name: Create release
        if: ${{ inputs.target == 'image' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum * > SHA256SUMS
          tag="tx6-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          gh release create "$tag" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tanix TX6 image $tag" \
            --notes "NixOS SD image for the Tanix TX6, built from commit ${GITHUB_SHA::7}. Flash with: zstdcat <image>.raw.zst | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync. The SPL is already in the image. First login: root / SBCDefaultBootstrapPassword."

      - uses: actions/upload-artifact@v4
        with:
          name: tanix-tx6-${{ inputs.target }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
